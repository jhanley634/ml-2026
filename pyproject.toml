[project]
name = "ml-2026"
version = "0.1.0"
readme = "ReadMe.md"
requires-python = ">= 3.14, < 3.15"

# security advisories
#  https://github.com/jhanley634/ml-2026/security/dependabot/32
#    "chromadb >= 1.5.9", from llama-index-vector-stores-chroma
#    "llama-index-core >= 0.14.22",
#    "llama-index-embeddings-ollama >= 0.9.0",
#    "llama-index-llms-ollama >= 0.10.1",
#    "llama-index-vector-stores-chroma >= 0.5.5",

dependencies = [
    "bs4 >= 0.0.2",
    "cappa >= 0.32.2",
    "gdal >= 3.13.3",
    "gitpython >= 3.1.61",
    "graphviz >= 0.21",
    "huggingface-hub >= 1.29.0",
    "hypothesis >= 6.167.1",
    "jax >= 0.11.1",
    "kagglehub >= 1.0.2",
    "lxml >= 6.1.3",
    "markdown >= 3.10.3",
    "nltk >= 3.10.3",
    "numpy >= 2.4.6",
    "nutpie >= 0.16.11",
    "opencv-python < 5",
    "pandas >= 3.0.5",
    "pillow >= 12.3.0",
    "pipdeptree >= 4.2.3",
    "polars >= 1.44.1",
    "pyarrow >= 25.0.1",
    "pymc >= 6.3.1",
    "pypdf >= 6.16.2",
    "pyttsx3 >= 2.99",
    "requests >= 2.34.2",
    "scikit-image >= 0.26.0",
    "scikit-learn >= 1.9.0",
    "seaborn >= 0.13.2",
    "sentence-transformers >= 6.0.1",
    "setuptools >= 84.0.0",
    "sqlalchemy >= 2.0.52",
    "streamlit >= 1.63.0",
    "toml >= 0.10.2",
    "torch >= 2.14.0",
    "transformers >= 5.16.1",
    "ty >= 0.0.78",
    "watchdog >= 6.0.0",
    "xgboost >= 3.4.1",
    "yfinance >= 1.7.0",
]
[dependency-groups]
dev = [
    "black",
    "isort",
    "mypy",
    "pre-commit",
    "pyright >= 1.1.411",
    "pytest",
    "ruff",
    "safety",
    "types-python-dateutil",
    "types-requests",
    "types-toml",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 100

[tool.isort]
float_to_top =            true
include_trailing_comma =  true
multi_line_output =       "VERTICAL_HANGING_INDENT"
line_length =             100

[tool.mypy]
exclude = "^.*/.venv/"

[tool.pyright]
reportUninitializedInstanceVariable = true
reportMissingTypeStubs = false
exclude = [
    "**/.venv/",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C", "C4", "C90", "COM",
    "DTZ", "E", "EM", "EXE", "F", "FBT", "FIX", "FURB", "G", "ICN", "INT", "ISC",
    "LOG", "N", "NPY", "PD", "PERF", "PIE", "PL", "PTH", "PYI", "Q",
    "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "TCH", "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
    "magic-value-comparison",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
