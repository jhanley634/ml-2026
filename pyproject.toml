[project]
name = "ml-2026"
version = "0.1.0"
readme = "ReadMe.md"
requires-python = ">= 3.14.7, < 3.15"

# security advisories
#  https://github.com/jhanley634/ml-2026/security/dependabot/96

dependencies = [
    "aiosqlite >= 0.22.1",
    "bs4 >= 0.0.2",
    "cappa >= 0.33.0",
    "certifi >= 2026.10.19",
    "filelock >= 4.2.4",
    "gdal >= 3.13.3",
    "gitpython >= 3.2.1",
    "glom >= 25.12.0",
    "googletrans >= 4.0.2",
    "graphviz >= 0.21",
    "greenlet >= 3.5.6",
    "holoviews >= 1.23.2",
    "huggingface-hub >= 2.2.0",
    "hypothesis >= 6.170.7",
    "jax >= 0.12.0.1",
    "jupyterlab >= 4.6.4",
    "kagglehub >= 1.0.3",
    "lxml >= 6.1.3",
    "markdown >= 3.11.2",
    "nltk >= 3.10.4",
    "numpy >= 2.5.4",
    "nutpie >= 0.16.11",
    "opencv-python < 5",
    "pandas >= 3.1.0",
    "pillow >= 13.0.0",
    "pipdeptree >= 4.2.9",
    "polars >= 2.0.0",
    "pyarrow >= 26.0.0",
    "pygame-ce >= 2.5.8",
    "pymc >= 6.3.2",
    "pypdf >= 6.21.2",
    "pyttsx3 >= 2.99",
    "requests >= 2.34.2",
    "requests-cache >= 1.3.3",
    "scikit-image >= 0.26.0",
    "scikit-learn >= 1.9.1",
    "seaborn >= 0.13.2",
    "sentence-transformers >= 6.2.0",
    "setuptools >= 84.2.1",
    "shapely >= 2.2.0",
    "sqlalchemy >= 2.1.6",
    "streamlit >= 1.66.1",
    "toml >= 0.10.2",
    "torch >= 2.14.1",
    "transformers >= 5.20.2",
    "types-seaborn >= 0.13.2.20261006",
    "watchdog >= 6.0.0",
    "xgboost >= 3.4.1",
    "yfinance >= 1.7.0",
]
[dependency-groups]
dev = [
    "beartype >= 0.22.9",
    "black",
    "isort",
    "mypy",
    "pre-commit",
    "pyrefly >= 1.3.1",
    "pyright >= 1.1.411",
    "pytest",
    "ruff",
    "safety",
    "ty >= 0.0.82",
    "types-python-dateutil",
    "types-requests",
    "types-toml",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 100

[tool.isort]
float_to_top =            true
include_trailing_comma =  true
multi_line_output =       "VERTICAL_HANGING_INDENT"
line_length =             100

[tool.mypy]
exclude = "^.*/.venv/"

[tool.pyright]
reportUninitializedInstanceVariable = true
reportMissingTypeStubs = false
exclude = [
    "**/.venv/",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C", "C4", "C90", "COM",
    "DTZ", "E", "EM", "EXE", "F", "FBT", "FIX", "FURB", "G", "ICN", "INT", "ISC",
    "LOG", "N", "NPY", "PD", "PERF", "PIE", "PL", "PTH", "PYI", "Q",
    "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "TCH", "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
    "magic-value-comparison",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.pyrefly]
project-excludes = ["**/*/.venv/"]
preset = "legacy"
